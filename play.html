<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0d06">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bogan-o Party remote</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎉</text></svg>">
<style>
  :root { --ink: #fff8ee; --dim: #d8c8b8; --bg: #1a0d06; --panel: #2c160b; --panel2: #3c1f10; --line: rgba(255,255,255,0.14); --hot: #ff7a3d; --gold: #ffd23f; --good: #5cff9d; --pc: #ff7a3d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  [data-b], .opts { touch-action: none; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: max(14px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }
  .hidden { display: none !important; }
  h1 { font-size: 26px; margin: 4px 0 10px; font-style: italic; text-transform: uppercase; }
  h2 { font-size: 22px; margin: 0 0 6px; }
  .dim { color: var(--dim); }
  .label { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); font-weight: 700; margin: 14px 0 6px; }
  button { font: inherit; font-weight: 800; color: var(--ink); background: var(--panel2); border: 2px solid var(--line); border-radius: 16px; padding: 14px; cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.35; }
  button.go { background: linear-gradient(180deg, #ff8a4d, #d9480f); border-color: transparent; }
  .wide { width: 100%; }
  input[type=text] { width: 100%; font: inherit; font-size: 20px; font-weight: 800; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); }
  .logo { font-weight: 900; font-size: 30px; font-style: italic; text-transform: uppercase; }
  .logo span { color: var(--gold); }
  .status { background: rgba(160,30,30,0.85); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; font-weight: 700; }
  .bodies { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .bodies button { padding: 10px 4px; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .bodies button .e { font-size: 28px; }
  .bodies button small { font-weight: 600; color: var(--dim); font-size: 10px; }
  .bodies button.on, .seg button.on { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 35%, var(--panel2)); }
  .faces { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .faces button { padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; }
  .faces .ph { width: 100%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,0.08); display: grid; place-items: center; font-size: 30px; overflow: hidden; }
  .faces .ph img { width: 100%; height: 100%; object-fit: cover; }
  .row { display: flex; gap: 10px; align-items: center; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center; background: var(--panel); border: 2px solid var(--pc); border-radius: 16px; padding: 8px 12px; margin-bottom: 12px; font-weight: 800; font-size: 17px; flex-wrap: wrap; }
  .bar .nm { margin-right: auto; }
  .bar .hp { width: 60px; height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; }
  .bar .hp i { display: block; height: 100%; background: #5cff9d; }
  .bar .pus { width: 100%; font-size: 13px; color: var(--dim); font-weight: 600; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opts.list { grid-template-columns: 1fr; }
  .opts.one { grid-template-columns: 1fr; }
  .opts button { min-height: 76px; font-size: 19px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; }
  .opts.list button { min-height: 60px; align-items: flex-start; text-align: left; }
  .opts button small { font-size: 12px; font-weight: 600; color: var(--dim); }
  .opts button.roll { min-height: 200px; font-size: 44px; border-radius: 28px; }
  .opts button.full { grid-column: 1 / -1; }
  .timer { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin: 8px 0 12px; }
  .timer i { display: block; height: 100%; background: var(--gold); transform-origin: left; }
  .emotes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
  .emotes button { font-size: 30px; padding: 10px; }
  .idle { text-align: center; padding: 30px 10px; }
  .idle .big { font-size: 60px; }
  .tiltbox { text-align: center; }
  /* live pads: the game view becomes a full screen frame, and the pad stretches to fill it */
  #vGame.pad { position: fixed; inset: 0; display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  #vGame.pad .bar { position: static; margin-bottom: 8px; }
  #vGame.pad #screen { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
  #vGame.pad #screen > * { flex: 1; min-height: 0; }
  .padhead { font-size: 15px; margin-bottom: 8px; }
  .padhead b { font-size: 18px; font-style: italic; text-transform: uppercase; margin-right: 4px; }
  .btnpad { display: flex; flex-direction: column; }
  .btnpad .timer { margin: 0 0 8px; }
  .prows { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .prow { display: flex; gap: 10px; min-height: 48px; }
  .prow button { flex: 1 1 0; min-width: 0; padding: 8px; font-size: clamp(16px, 4.2vmin + 6px, 30px); display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 18px; touch-action: none; }
  .prow button.small { font-size: 15px; }
  .prow button.dn { transform: scale(0.94); filter: brightness(1.3); }
  .lanes { flex: 1; display: flex; gap: 0; min-height: 0; border-radius: 18px; overflow: hidden; background: #1c1c20; border: 2px solid #4a4a4e; position: relative; }
  .lanes .lane { flex: 1 1 0; min-width: 0; border: 0; border-right: 1px solid #4a4a4e; border-radius: 0; padding: 0 6px 10px; display: flex; align-items: flex-end; justify-content: center; touch-action: none;
    background: linear-gradient(0deg, color-mix(in srgb, var(--lc) 30%, transparent), transparent 70%); }
  .lanes .lane:last-child { border-right: 0; }
  .lanes .lane i { font-style: normal; border: 4px solid rgba(255,255,255,0.85); width: 100%; max-width: 170px; height: 128px; border-radius: 22px; background: var(--lc); color: #1a0d06; display: grid; place-items: center; font-size: clamp(14px, 3vmin + 6px, 22px); box-shadow: 0 5px 0 rgba(0,0,0,0.45); }
  .lanes .lane:active { transform: none; }
  .lanes .lane:active i { transform: translateY(4px) scale(0.96); box-shadow: 0 1px 0 rgba(0,0,0,0.45); filter: brightness(1.2); }
  @media (orientation: landscape) and (max-height: 500px) { .lanes .lane i { height: 46%; } }
  .sliderpad { text-align: center; display: flex; flex-direction: column; gap: 8px; }
  .sliderpad h1 { margin: 0; }
  .vtrack { position: relative; flex: 1; min-height: 200px; width: 150px; margin: 6px auto; border-radius: 36px; background: #2c160b; border: 3px solid var(--line); touch-action: none; overflow: hidden; }
  .vtrack .vfill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, #3e7a2a, #6fbf3f); opacity: 0.55; pointer-events: none; }
  .vtrack .vthumb { position: absolute; left: 8px; right: 8px; height: 64px; border-radius: 28px; background: var(--pc); display: grid; place-items: center; font-size: 30px; box-shadow: 0 4px 0 rgba(0,0,0,.4); pointer-events: none; }
  .stickpad { display: grid; grid-template-columns: 1.15fr 1fr; grid-template-rows: auto 1fr; gap: 10px; }
  .stickpad.nobtns { grid-template-columns: 1fr; } .stickpad.nobtns .stickbtns { display: none; }
  .stickhead { grid-column: 1 / -1; font-size: 15px; }
  .stickhead b { font-size: 18px; font-style: italic; text-transform: uppercase; margin-right: 4px; }
  .stickzone { position: relative; border-radius: 22px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); touch-action: none; overflow: hidden; }
  .stickzone .ghost { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--dim); font-weight: 800; letter-spacing: 0.1em; font-size: 13px; }
  .stickzone .base, .stickzone .knob { display: none; position: absolute; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  .stickzone .base { width: 130px; height: 130px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); }
  .stickzone .knob { width: 62px; height: 62px; background: var(--pc); box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
  .stickbtns { display: grid; grid-template-columns: 1fr; grid-auto-rows: 1fr; gap: 10px; touch-action: none; }
  .stickbtns.n3, .stickbtns.n4 { grid-template-columns: 1fr 1fr; }
  .stickbtns.n3 button:first-child { grid-column: 1 / -1; }
  .stickbtns button { font-size: clamp(16px, 3.6vmin + 6px, 26px); min-height: 56px; touch-action: none; border-radius: 22px; }
  .stickbtns button.dn, .opts button.dn { transform: scale(0.94); filter: brightness(1.3); }
  @media (orientation: portrait) { .stickpad { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; } .stickbtns { min-height: 34vh; } }
  .wing { width: 260px; height: 260px; margin: 10px auto; border-radius: 50%; background: radial-gradient(circle, #3c1f10, #2c160b); border: 3px solid var(--line); display: grid; place-items: center; position: relative; }
  .wing .plane { width: 220px; height: 14px; background: var(--pc); border-radius: 7px; position: relative; transition: transform 60ms linear; }
  .wing .plane::after { content: ''; position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; border-radius: 50%; background: var(--pc); transform: translate(-50%, -50%); }
  input[type=range] { width: 100%; }
  .sideways { display: inline-block; margin-top: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(255,210,63,0.16); color: var(--gold); font-size: 13px; font-weight: 800; }
  @media (orientation: landscape) { .sideways { display: none; }
    #vGame.pad .bar { display: none; }
    .sliderpad { display: grid; grid-template-columns: 1fr auto; grid-template-rows: 1fr; gap: 0 18px; align-items: center; text-align: left; }
    .sliderpad .vtrack { height: 100%; min-height: 0; margin: 0; width: 140px; }
    .tiltbox { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr; gap: 0 18px; align-items: center; text-align: left; }
    .tilthead { grid-column: 1 / -1; } .tilthead h1 { font-size: 20px; margin: 0 0 2px; }
    .tiltbox .wing { width: min(52vh, 240px); height: min(52vh, 240px); margin: 6px; }
    .tiltbox .wing .plane { width: 85%; } }
  .tpad { position: fixed; inset: 0; z-index: 10; background: #0d0603; touch-action: none; overflow: hidden; }
  .tpbox { position: absolute; left: 50%; top: 50%; border-radius: 18px; border: 2px solid rgba(255,255,255,0.22); background: radial-gradient(circle at 50% 60%, #24361a, #0f1a0b); overflow: hidden; pointer-events: none; }
  .tpgrid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px); background-size: 33.33% 33.33%; }
  .tphint { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; color: var(--dim); font-weight: 700; font-size: 14px; padding: 0 20px; }
  .tphint b { color: var(--ink); font-size: 20px; }
  .tpdot { display: none; position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 3px solid var(--pc); box-shadow: 0 0 0 2px rgba(0,0,0,0.5); }
  .tpdot::after { content: ''; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--pc); }
  .tpflipbtn, .tprot { display: none; }
  .tpad.rot .tpflipbtn { display: block; position: absolute; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); padding: 8px 12px; font-size: 14px; z-index: 2; }
  .tpad.rot .tprot { display: block; position: absolute; left: 10px; right: 100px; bottom: max(12px, env(safe-area-inset-bottom)); color: var(--dim); font-size: 12px; font-weight: 700; }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: flex-end; z-index: 20; }
  .sheet .in { background: var(--panel); width: 100%; border-radius: 22px 22px 0 0; padding: 18px 16px max(20px, env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }
  .crop { width: min(80vw, 320px); aspect-ratio: 1; margin: 10px auto; touch-action: none; border-radius: 16px; overflow: hidden; }
  .crop canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="status hidden" id="status"></div>

<!-- connecting -->
<section id="vConnect" class="idle"><div class="logo">Bogan-o <span>Party</span></div><p class="dim">Connecting to the TV…</p></section>

<!-- lobby -->
<section id="vLobby" class="hidden">
  <div class="logo">Bogan-o <span>Party</span></div>
  <div class="label">Your name</div>
  <input type="text" id="name" maxlength="16" placeholder="Your name" autocomplete="off">
  <div class="label">Your blow-up doll</div>
  <div class="bodies" id="bodies"></div>
  <div class="label">Headgear</div>
  <div class="bodies" id="hats"></div>
  <div class="label">Outfit</div>
  <div class="bodies" id="outfits"></div>
  <div class="label">Your faces (tap to take a photo)</div>
  <div class="faces" id="faces"></div>
  <p class="dim" style="font-size:13px">Pull a face for each mood. Missing ones use your neutral photo, or a cartoon face.</p>
  <div class="label">Map</div>
  <div class="row"><div style="flex:1"><b id="mapName"></b><div class="dim" id="mapItem" style="font-size:13px"></div></div><button id="mapBtn">Change ▶</button></div>
  <div style="height:14px"></div>
  <button class="go wide" id="readyBtn" style="font-size:22px; padding:18px">I'm ready!</button>
</section>

<!-- in game -->
<section id="vGame" class="hidden">
  <div class="bar" id="bar"></div>
  <div id="screen"></div>
</section>

<!-- photo sheet -->
<div class="sheet hidden" id="sheet"><div class="in">
  <div class="row"><h2 id="sheetTitle" style="flex:1">Neutral face</h2><button id="sheetClose">✕</button></div>
  <div class="row" id="pickRow"><button class="go" id="takeBtn" style="flex:1">📷 Take photo</button><button id="fileBtn" style="flex:1">🖼️ Choose</button></div>
  <input type="file" id="camIn" accept="image/*" capture="user" hidden>
  <input type="file" id="fileIn" accept="image/*" hidden>
  <div id="cropArea" class="hidden">
    <div class="crop" id="cropBox"><canvas id="cropCv" width="512" height="512"></canvas></div>
    <div class="dim" style="text-align:center;font-size:13px">Drag to line your face up in the circle</div>
    <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
    <button class="go wide" id="useBtn">Use this face</button>
  </div>
  <button class="wide hidden" id="clearBtn" style="margin-top:10px">Remove this photo</button>
</div></div>

<script type="module" src="js/phone/main.js"></script>
</body>
</html>
