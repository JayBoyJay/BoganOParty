<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doll lab</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<style>html, body { margin: 0; height: 100%; background: #2b2f36; overflow: hidden; } canvas { display: block; width: 100%; height: 100%; }
#ui { position: fixed; left: 12px; top: 12px; display: flex; gap: 8px; font: 600 14px system-ui; }
button { padding: 8px 14px; border-radius: 10px; border: 0; background: #ff4f8b; color: #fff; font: inherit; cursor: pointer; }</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><button id="hop">Hop</button><button id="flinch">Hit</button><button id="happy">Happy</button><button id="spin">Spin</button></div>
<script type="module">
// A turntable for the player dolls: every body type side by side, with buttons to poke them.
// Open /doll-lab.html while the server runs. ?cam=x,y,z,lx,ly,lz sets the camera, ?kinds=bloke,sheila
// picks the bodies, ?rot= turns them, ?auto hops on a loop.
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';
import { Doll } from './js/host/doll.js';

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2f36);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const sun = new THREE.DirectionalLight(0xfff2e0, 2.6);
sun.position.set(4, 8, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
scene.add(sun, new THREE.HemisphereLight(0xcfe4ff, 0x6a5040, 0.6));
const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 48), new THREE.MeshStandardMaterial({ color: 0x8a7a6a, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
const cam = (q.get('cam') || '0,2.6,9.5,0,1.5,0').split(',').map(Number);
camera.position.set(cam[0], cam[1], cam[2]); camera.lookAt(cam[3], cam[4], cam[5]);

const kinds = (q.get('kinds') || 'bloke,sheila,smooth,both').split(',');
const hats = (q.get('hats') || '').split(','), outfits = (q.get('outfits') || '').split(','); // ?hats=akubra,beanie&outfits=footy,flanno
const dolls = kinds.map((body, i) => {
  const d = new Doll({ id: 'p' + i, name: body, color: ['#ff4f8b', '#3da5ff', '#ffd23f', '#5cff9d'][i % 4], body, hat: hats[i % hats.length] || undefined, outfit: outfits[i % outfits.length] || undefined, hair: [0x3a2418, 0xd9a441, 0x1a1a1a, 0x8a3b1f][i % 4] }, { tag: false });
  d.group.position.x = (i - (kinds.length - 1) / 2) * 2.4;
  d.home = d.group.position.clone();
  d.group.rotation.y = Number(q.get('rot') || 0);
  scene.add(d.group);
  return d;
});

const anims = [];
const hop = () => dolls.forEach((d, i) => anims.push({ t: -i * 0.08, dur: 0.45, fn: (k) => { d.group.position.y = Math.sin(k * Math.PI) * 1.2; d.group.position.z = d.home.z + (k < 1 ? k : 0) * 0; } }));
const spin = () => dolls.forEach((d) => anims.push({ t: 0, dur: 0.8, fn: (k) => { d.group.rotation.y = k * Math.PI * 2; } }));
document.getElementById('hop').onclick = hop;
document.getElementById('flinch').onclick = () => dolls.forEach((d) => d.flinch());
document.getElementById('happy').onclick = () => dolls.forEach((d) => d.setMood('happy'));
document.getElementById('spin').onclick = spin;
window.__lab = { dolls, hop, spin };

const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
let auto = 0;
// ?manual: no clock; __lab.step(dt) advances and draws one frame (for recording smooth clips)
const frame = (dt) => {
  if (q.has('auto') && (auto += dt) > 1.6) { auto = 0; hop(); }
  for (const a of [...anims]) { a.t += dt; if (a.t < 0) continue; const k = Math.min(1, a.t / a.dur); a.fn(k); if (k >= 1) anims.splice(anims.indexOf(a), 1); }
  for (const d of dolls) d.update(dt);
  renderer.render(scene, camera);
};
window.__lab.step = frame;
if (!q.has('manual')) renderer.setAnimationLoop(() => frame(Math.min(0.05, clock.getDelta())));
</script>
</body>
</html>
