<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound lab</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #1d2026; color: #f2f2f2; font: 15px system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; } p { margin: 0 0 16px; color: #aab; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #ffd23f; margin: 18px 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button { padding: 10px 14px; border-radius: 10px; border: 0; background: #ff4f8b; color: #fff; font: 600 14px system-ui; cursor: pointer; min-width: 72px; }
  button:active { transform: scale(0.96); }
</style>
</head>
<body>
<h1>Sound lab</h1>
<p>Every song and sound effect in the game, synthesised live. Tap to play; tap a song again to stop it.</p>
<div id="groups"></div>
<script type="module">
// Plays every sound in js/host/sfx.js. Open /sfx-lab.html while the server runs (or on GitHub Pages).
import { Sfx, SOUNDS } from './js/host/sfx.js';
import { Music } from './js/host/music.js';
import { SONGS } from './js/content/music.js';
const sfx = new Sfx(), music = new Music(sfx);
const root = document.getElementById('groups');
{
  const h = document.createElement('h2'); h.textContent = 'music'; root.append(h);
  const row = document.createElement('div'); row.className = 'row'; root.append(row);
  for (const s of SONGS) {
    const b = document.createElement('button'); b.textContent = `${s.title} (${s.scenes.join(', ')})`;
    b.onclick = () => { const on = b.dataset.on; row.querySelectorAll('button').forEach((x) => delete x.dataset.on); if (on) return music.stop(); music.preview(s.id); b.dataset.on = 1; };
    row.append(b);
  }
}
for (const [group, names] of Object.entries(SOUNDS)) {
  const h = document.createElement('h2'); h.textContent = group; root.append(h);
  const row = document.createElement('div'); row.className = 'row'; root.append(row);
  for (const n of names) {
    const b = document.createElement('button'); b.textContent = n;
    b.onclick = () => { sfx.unlock(); sfx.play(n); };
    row.append(b);
  }
}
</script>
</body>
</html>
